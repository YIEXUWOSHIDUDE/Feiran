# Build, test and push a release, then install it on the EC2 host. Only by hand ("Run workflow"),
# never on a merge: the host holds real data. Each selected GitHub environment keeps its own
# host, registry and release role; its protection rules decide who may release and from which
# branch. AWS trusts only this repository in that environment. Account and host identifiers
# are environment secrets so this public repository's logs mask them. See docs/aws-deployment.md.
name: Release to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The isolated AWS destination; each has its own protected environment and secrets.
        type: choice
        required: true
        default: aws
        options: [aws, aws-v2-pilot]
      install:
        description: >-
          Install it on the host. Turn off only for the very first release, which is pushed so the
          new data volume can be formatted with it before anything is installed.
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # the OIDC token the release role trusts

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, push and install
    if: inputs.environment == 'aws' || inputs.environment == 'aws-v2-pilot'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE_ROLE: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
      REPOSITORY: ${{ secrets.AWS_REPOSITORY_URI }}
      HOST: ${{ secrets.AWS_HOST_ID }}
      DOCUMENT: ${{ secrets.AWS_RELEASE_DOCUMENT }}
    steps:
      - uses: actions/checkout@v7
      - name: Mask derived AWS identifiers before using them
        run: |
          # Full secrets are masked by GitHub; tools may print just the account or registry.
          account=$(printf '%s' "$RELEASE_ROLE" | cut -d: -f5)
          registry=${REPOSITORY%%/*}
          for value in "$account" "$registry"; do
            test -n "$value" || { echo "Missing AWS release configuration"; exit 1; }
            echo "::add-mask::$value"
          done
      - name: Sign in to AWS as the release role, with this job's OIDC token
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$token"
          # What the token says, so the role's trust can be checked against it; never the token itself.
          python3 - "$token" <<'EOF'
          import base64, json, sys
          part = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          print(json.dumps({key: claims.get(key) for key in ("sub", "aud", "repository", "environment", "ref")}, indent=1))
          EOF
          credentials=$(aws sts assume-role-with-web-identity --role-arn "$RELEASE_ROLE" \
            --role-session-name "release-$GITHUB_RUN_ID" --web-identity-token "$token" --query Credentials --output json)
          for pair in AWS_ACCESS_KEY_ID:AccessKeyId AWS_SECRET_ACCESS_KEY:SecretAccessKey AWS_SESSION_TOKEN:SessionToken; do
            value=$(printf '%s' "$credentials" | python3 -c "import json, sys; print(json.load(sys.stdin)['${pair#*:}'])")
            echo "::add-mask::$value"
            echo "${pair%%:*}=$value" >> "$GITHUB_ENV"
          done
      - name: Build the image for linux/amd64, labelled and tagged with the commit
        run: docker build --platform linux/amd64 --build-arg REVISION="$GITHUB_SHA" -t "$REPOSITORY:$GITHUB_SHA" .
      - name: The tests pass inside the image
        run: docker run --rm "$REPOSITORY:$GITHUB_SHA" python -m unittest discover -s tests -t . -p "test_*.py"
      - name: Push it (a tag is never replaced) and read its digest
        id: push
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"
          pushed() {
            aws ecr describe-images --repository-name "${REPOSITORY#*/}" --image-ids imageTag="$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' --output text 2> /dev/null
          }
          pushed > /dev/null || docker push "$REPOSITORY:$GITHUB_SHA"
          digest=$(pushed)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Release"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- image digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install it on the host (checked against the data; the release before comes back if it fails)
        if: inputs.install
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          IMAGE="$REPOSITORY@$DIGEST"
          id=$(aws ssm send-command --instance-ids "$HOST" --document-name "$DOCUMENT" \
            --parameters "Image=$IMAGE" --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 180); do  # up to 30 minutes: pulling the image, the health check and the data check
            if ! status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$HOST" \
                --query Status --output text 2>&1); then
              # Right after sending, the command may not be found yet; any other error ends the wait.
              case "$status" in *InvocationDoesNotExist*) status=Pending ;; *) echo "$status (command $id)"; exit 1 ;; esac
            fi
            case "$status" in Pending|InProgress|Delayed|Cancelling) sleep 10 ;; *) break ;; esac
          done
          # Detailed host output can contain private file names; inspect it in AWS, not public logs.
          echo "SSM command: $id"
          echo "- result on the host: $status" >> "$GITHUB_STEP_SUMMARY"
          test "$status" = Success
